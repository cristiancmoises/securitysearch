[securitysearch]
user = apache
group = apache
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; Keep PHP concurrency at the previous prefork ceiling. Apache event threads may
; serve static assets/keep-alive connections independently without multiplying
; provider-search concurrency or PHP memory pressure.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.max_requests = 1000

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
request_terminate_timeout = 30s
