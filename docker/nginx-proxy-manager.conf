# Nginx Proxy Manager — Advanced configuration for securityops.co
# =================================================================
#
# Paste the contents below into your NPM proxy host:
#
#   1. NPM dashboard → Hosts → Proxy Hosts → edit "securityops.co"
#   2. "Details" tab:
#        - Domain Names: securityops.co (and any aliases like www.securityops.co)
#        - Scheme: http
#        - Forward Hostname/IP: the private Docker-host bridge address
#          reachable from NPM (172.17.0.1 on the current IONOS VPS)
#        - Forward Port: 5140
#        - Cache Assets is optional; the custom cache below is active only after
#          the named `secsearch` zone is installed in NPM's global http{} scope
#        - [✓] Block Common Exploits
#        - [✓] Websockets Support
#   3. "SSL" tab:
#        - Request a new Let's Encrypt cert (or use an existing one)
#        - [✓] Force SSL
#        - [✓] HTTP/2 Support
#        - [✓] HSTS Enabled
#        - [✓] HSTS Subdomains
#   4. Install the REQUIRED global http{} declarations at the bottom of this
#      file, test Nginx, then paste the server-level contents into "Advanced".
#
# After saving, NPM regenerates the nginx config and reloads. Verify with:
#   curl -I https://securityops.co/
#
# `limit_req_zone`, `map`, and `proxy_cache_path` are http{} directives and
# cannot be created in the proxy-host Advanced box. The sample is not active
# merely because this file exists in the application repository. After every
# change, inspect the effective configuration with `nginx -T`.
# =================================================================


# --------------------------------------------------------------
# 1. Real client IP
# --------------------------------------------------------------
# The container's mod_remoteip will use these headers to log the true
# visitor IP instead of NPM's internal docker IP.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;


# --------------------------------------------------------------
# 2. Optional edge-side caching
# --------------------------------------------------------------
# Every `proxy_cache secsearch` below requires the global `proxy_cache_path`
# declared at the bottom of this file. Nginx will reject the configuration if
# the named zone is absent. Application `private` and `no-store` responses are
# still authoritative and must not be overridden.

# Static assets — long cache, immutable
location ~* ^/(static|banner)/ {
    proxy_pass $forward_scheme://$server:$port;
    proxy_cache secsearch;
    proxy_cache_lock on;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    expires 30d;
    add_header Cache-Control "public, immutable, max-age=2592000" always;
    add_header X-Cache-Status $upstream_cache_status always;
    access_log off;
}

# Favicons — short TTL so site favicons can update.
location ~* ^/favicon\.(ico|png)$ {
    proxy_pass $forward_scheme://$server:$port;
    proxy_cache secsearch;
    proxy_cache_lock on;
    proxy_cache_valid 200 7d;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
}

# Favicon proxy — saves many upstream calls.
location /favicon {
    proxy_pass $forward_scheme://$server:$port;
    proxy_cache secsearch;
    proxy_cache_lock on;
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1h;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Image proxy — application cache/privacy headers remain authoritative.
location /proxy {
    # The global maps put animated requests only in `media`; every other proxy
    # request remains in `proxy`. This avoids stacking the 600/min general zone
    # in front of the application's 900/min animated-preview allowance.
    limit_req zone=proxy burst=40 nodelay;
    limit_req zone=media burst=60 nodelay;
    limit_req_status 429;
    proxy_pass $forward_scheme://$server:$port;
    proxy_cache secsearch;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 15m;
    proxy_cache_valid 404 1h;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}


# --------------------------------------------------------------
# 3. Rate limiting (DEFENSE — prevents bot abuse of the proxy)
# --------------------------------------------------------------
# These reference zones that must be declared globally — see the
# instructions at the bottom of this file.

# Search endpoints — ~30 requests/minute per IP, burst of 10
location ~ ^/(web|images|videos|news|music)(/|$|\?) {
    limit_req zone=search burst=10 nodelay;
    limit_req_status 429;
    proxy_pass $forward_scheme://$server:$port;
    proxy_buffering off;          # streaming search results
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# API endpoints — separate, lower limit
location ~ ^/(api|ami4get|resolver)(/|$|\?) {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass $forward_scheme://$server:$port;
    add_header X-Robots-Tag "noindex, nofollow" always;
}


# --------------------------------------------------------------
# 4. Block trash paths early without inspecting proxied target URLs
# --------------------------------------------------------------
# `$request_uri` contains the query string. Never use it for path-signature WAF
# checks: `/proxy?i=https://example/.../wp-content/uploads/file.gif` is a valid
# image-proxy request, not a request to a local WordPress path. `$uri` is the
# normalized local path and excludes the encoded target URL.
if ($uri ~* "/(\.env|\.git|wp-admin|wp-login|wp-includes|xmlrpc|phpmyadmin|phpunit|adminer|admin\.php|administrator|fckeditor|tinymce|webdav|cgi-bin|invoker|jmx-console|manager/html|axis2|struts|HNAP1)") {
    return 444;
}

# The global map below exposes `$securitysearch_waf_args`: it equals `$args` on
# ordinary application paths and is empty only on `/proxy` and `/proxy.php`.
# Any additional SQL/XSS query-signature rules merged into this host MUST inspect
# that derived variable, never raw `$args`. This narrow text-signature exemption
# does not disable the application proxy's public-address/SSRF validation, MIME
# validation, byte limits, or the proxy/media rate limits above.

# Block obvious scanners
if ($http_user_agent ~* "(zgrab|masscan|nmap|sqlmap|nikto|wpscan|acunetix|netsparker|nessus|openvas)") {
    return 444;
}


# --------------------------------------------------------------
# 5. Compression (NPM may already do this; this is belt-and-braces)
# --------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml application/atom+xml application/manifest+json
    image/svg+xml;


# --------------------------------------------------------------
# 6. Buffering and timeouts tuned for search workload
# --------------------------------------------------------------
# Default location — the home page, settings, etc.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
client_max_body_size 8m;
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 30s;


# --------------------------------------------------------------
# 7. Edge-level security headers
# --------------------------------------------------------------
# These complement the per-PHP-script headers. NPM's HSTS toggle
# already sets Strict-Transport-Security; everything else here.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "interest-cohort=(), browsing-topics=()" always;


# =================================================================
# REQUIRED IN NPM'S MAIN nginx.conf  (one-time setup)
# =================================================================
#
# The `limit_req`, WAF argument isolation, and cache directives above need the
# following declarations in http{}.
# NPM's containerized layout puts the main config at:
#   /data/nginx/custom/http_top.conf       (NPM v2.10+, persisted)
#   or /etc/nginx/conf.d/include/http_top.conf
#
# Create that file (host-side: `/data/nginx/custom/http_top.conf`)
# with these contents:
#
#     # Per-IP rate-limit zones for Security Search
#     limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;
#     limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
#     # Keep ordinary thumbnails/originals at 600/min. An empty key is not
#     # counted by limit_req, so s=animated is governed only by `media` below.
#     map $arg_s $securitysearch_proxy_key {
#         default  $binary_remote_addr;
#         animated "";
#     }
#     limit_req_zone $securitysearch_proxy_key zone=proxy:10m rate=600r/m;
#
#     # Generic WAF query signatures use this variable, not raw $args. A proxied
#     # target URL is validated by Security Search's SSRF/image pipeline instead.
#     map $uri $securitysearch_waf_args {
#         default                 $args;
#         ~^/proxy(?:\.php)?$     "";
#     }
#
#     map $arg_s $securitysearch_media_key {
#         default  "";
#         animated $binary_remote_addr;
#     }
#     limit_req_zone $securitysearch_media_key zone=media:10m rate=900r/m;
#
#     # Proxy cache for the upstream container
#     proxy_cache_path /var/cache/nginx/security-search
#         levels=1:2
#         keys_zone=secsearch:10m
#         max_size=512m
#         inactive=1d
#         use_temp_path=off;
#
# Test first, using the actual container name for the installation:
#     docker exec <npm-container> nginx -t
# Then reload or restart that exact container and inspect:
#     docker exec <npm-container> nginx -T
#
# Confirm the live output contains the three maps, four limit zones, the named
# cache path, and every intended `proxy_cache secsearch` directive. For a
# controlled image whose encoded upstream path contains `/wp-content/uploads/`,
# `/proxy` must no longer return 444. Also confirm a private-address target is
# still rejected by the application's SSRF guard.
#
# =================================================================
