LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

SSLRandomSeed startup file:/dev/urandom 512
SSLRandomSeed connect builtin

Listen 443

# Modern TLS profile (Mozilla "Intermediate" 2024 — TLS 1.2 + 1.3, no weak ciphers).
# Drops MD5/RC4/3DES/SHA1/CBC entirely.
SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLProxyProtocol        -all +TLSv1.2 +TLSv1.3

# TLS 1.3 ciphers are non-negotiable, listed for clarity.
# TLS 1.2 list is the Mozilla intermediate set.
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
SSLProxyCipherSuite     ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
SSLHonorCipherOrder     off

SSLPassPhraseDialog     builtin

SSLSessionCache         "shmcb:/var/cache/mod_ssl/scache(512000)"
SSLSessionCacheTimeout  300

# OCSP stapling
SSLUseStapling          on
SSLStaplingResponderTimeout 5
SSLStaplingReturnResponderErrors off
SSLStaplingCache        "shmcb:/var/cache/mod_ssl/stapling(128000)"

# HSTS at the Apache layer too — defense in depth alongside PHP headers.
<IfModule headers_module>
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" "expr=%{HTTPS} == 'on'"
</IfModule>
