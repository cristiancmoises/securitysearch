# Anonymous homepage fast path. Apache reaches these generated files only after
# strict method/query/cookie/authorization checks in the DocumentRoot rewrite
# rules. Search pages and personalized homepage requests always continue to PHP.
<FilesMatch "^home-anonymous\.generated\.fast(?:\.gz)?$">
    ForceType text/html
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "public, max-age=60, stale-while-revalidate=30" "expr=%{REQUEST_STATUS} >= 200 && %{REQUEST_STATUS} < 400"
    Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
    Header merge Vary "Accept-Encoding"
    Header merge Vary "Cookie"
    Header merge Vary "Authorization"
    Header always set X-SecuritySearch-Render "static-home" "expr=%{REQUEST_STATUS} >= 200 && %{REQUEST_STATUS} < 400"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(self), battery=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), interest-cohort=(), browsing-topics=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), web-share=(), xr-spatial-tracking=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Cross-Origin-Embedder-Policy "unsafe-none"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'none'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self' data:; connect-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; manifest-src 'self'; object-src 'none'; worker-src 'none'; upgrade-insecure-requests"
</FilesMatch>

# Pre-compressed representation generated from the exact same validated HTML.
# no-gzip prevents mod_deflate from compressing an already-gzipped body.
<Files "home-anonymous.generated.fast.gz">
    Header always set Content-Encoding "gzip" "expr=%{REQUEST_STATUS} >= 200 && %{REQUEST_STATUS} < 400"
    SetEnv no-gzip 1
</Files>

# Byte ranges refer to the identity representation; no dynamic recompression.
<Files "home-anonymous.generated.fast">
    SetEnvIf Range "." no-gzip=1
    SetEnvIf If-Range "." no-gzip=1
</Files>
