# Generated CSS/JS variants only: no PHP, responses, queries or image originals.
# gzip is precomputed at startup. Missing sidecars retain normal static delivery.
<Directory "/var/www/html/4get/static">
    RewriteEngine On
    # Sidecars are an implementation detail, not a second public asset URL.
    RewriteRule "\.pre\.gz$" "-" [R=404,END]
    # Match decoded paths too; END prevents internal rewrites from re-entering.
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{HTTP:Range} ^$
    RewriteCond %{HTTP:If-Range} ^$
    RewriteCond %{HTTP:Accept-Encoding} "(^|,[[:space:]]*)gzip([[:space:]]*;[[:space:]]*q=(1(\.0{0,3})?|0\.(?!0{1,3}[[:space:]]*(,|$))[0-9]{1,3}))?[[:space:]]*(,|$)" [NC]
    RewriteCond %{HTTP:Accept-Encoding} "!(^|,[[:space:]]*)gzip[[:space:]]*;[[:space:]]*q=0(\.0{0,3})?[[:space:]]*(,|$)" [NC]
    RewriteCond %{REQUEST_FILENAME}.pre.gz -f
    RewriteRule "^(.+\.(?:css|js))$" "$1.pre.gz" [END,E=no-gzip:1]
</Directory>
<FilesMatch "\.(?:css|js)\.pre\.gz$">
    Header always set Content-Encoding "gzip" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 206 || %{REQUEST_STATUS} == 304"
    Header merge Vary "Accept-Encoding"
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "public, max-age=2592000, immutable" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 206 || %{REQUEST_STATUS} == 304"
    Header always set X-SecuritySearch-Asset "gzip-static" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 206 || %{REQUEST_STATUS} == 304"
    SetEnv no-gzip 1
    SetEnv no-brotli 1
</FilesMatch>
<FilesMatch "\.css\.pre\.gz$">
    ForceType text/css
</FilesMatch>
<FilesMatch "\.js\.pre\.gz$">
    ForceType application/javascript
</FilesMatch>

# Byte ranges select the original representation; never a truncated gzip stream.
<FilesMatch "\.(?:css|js)$">
    SetEnvIfNoCase Range ".+" no-gzip=1
    Header merge Vary "Accept-Encoding"
</FilesMatch>
