# SecuritySearch PHP-FPM handler. Loaded only when the entrypoint selects FPM.
# The backend is loopback-only inside the container; it is never published.
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

ProxyTimeout 30
ProxyErrorOverride Off
ProxyFCGIBackendType FPM

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>
