Listen 80
ServerTokens Prod
ServerRoot /var/www
ServerSignature Off
ServerName localhost
TraceEnable Off
FileETag None

# When behind nginx-proxy-manager, the X-Forwarded-* headers tell us
# the real client IP and original protocol. mod_remoteip rewrites
# REMOTE_ADDR so logs and PHP $_SERVER report the actual visitor.
LoadModule remoteip_module modules/mod_remoteip.so
RemoteIPHeader X-Forwarded-For
# Trust the docker bridge networks (NPM lives there).
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 127.0.0.1

DocumentRoot "/var/www/html/4get"

LogLevel warn
# Send logs to stderr so docker logs capture them.
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /dev/stderr combined
ErrorLog /dev/stderr

<Directory "/var/www/html/4get">
    RewriteEngine On
    # Strip .php extension from URLs (existing 4get behaviour).
    RewriteCond %{THE_REQUEST} ^\w+\ /(.*)\.php(\?.*)?\ HTTP/
    RewriteRule ^ http://%{HTTP_HOST}/%1 [R=301]
    RewriteCond %{REQUEST_FILENAME}.php -f
    RewriteRule .* $0.php
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# deny access to private resources
<Directory "/var/www/html/4get/data">
    Require all denied
    <Files "*">
        Require all denied
    </Files>
</Directory>

<Directory "/var/www/html/4get/lib">
    Require all denied
</Directory>

<Directory "/var/www/html/4get/scraper">
    Require all denied
</Directory>

<Directory "/var/www/html/4get/oracles">
    Require all denied
</Directory>

<Directory "/var/www/html/4get/docker">
    Require all denied
</Directory>
<Directory "/var/www/html/4get/tests">
    Require all denied
</Directory>

# The favicon cache is the only Apache-writable application directory. Keep
# every cached object on the static-file path and deny script-like filenames.
<Directory "/var/www/html/4get/icons">
    AllowOverride None
    Options -ExecCGI -Indexes
    <FilesMatch ".*">
        SetHandler none
    </FilesMatch>
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar|phps|cgi|pl|py|rb|sh|bash)$">
        SetHandler none
        Require all denied
    </FilesMatch>
</Directory>

# Deny dotfiles globally
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
# Allow well-known though
<Directory "/var/www/html/4get/.well-known">
    Require all granted
    <FilesMatch ".*">
        Require all granted
    </FilesMatch>
</Directory>

LoadModule rewrite_module modules/mod_rewrite.so
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule expires_module modules/mod_expires.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule negotiation_module modules/mod_negotiation.so

<IfModule unixd_module>
User apache
Group apache
</IfModule>

# Connection-level hardening
Timeout 30
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100

<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,minrate=500
    RequestReadTimeout body=20,minrate=500
</IfModule>

# Tuned prefork settings
<IfModule mpm_prefork_module>
    StartServers          4
    MinSpareServers       4
    MaxSpareServers       8
    MaxRequestWorkers     16
    MaxConnectionsPerChild 1000
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html index.php
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

<IfModule headers_module>
    RequestHeader unset Proxy early

    # Cache static assets aggressively
    <FilesMatch "\.(?:css|js|woff2?|ttf|eot|webp|svg|png|jpg|jpeg|gifv?|ico)$">
        Header set Cache-Control "public, max-age=2592000, immutable"
        Header unset Pragma
    </FilesMatch>

    # Never cache dynamic responses
    <FilesMatch "\.(?:php|html)$">
        Header setifempty Cache-Control "no-cache, no-store, must-revalidate"
        Header setifempty Pragma "no-cache"
        Header setifempty Expires "0"
    </FilesMatch>

    # Defense-in-depth even though PHP also sets these
    Header onsuccess unset X-Content-Type-Options
    Header onsuccess unset X-Frame-Options
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always unset Server
    Header always unset X-Powered-By
</IfModule>

# lain.gifv is the bundled, validated GIF raster, not a video container.
<Files "lain.gifv">
    ForceType image/gif
</Files>

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE \
        text/html text/plain text/css text/xml text/javascript \
        application/javascript application/x-javascript \
        application/json application/xml application/rss+xml \
        application/atom+xml image/svg+xml \
        application/x-web-app-manifest+json
    # Don't double-compress already-compressed content
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|woff2?|gz|bz2|zip|rar|7z|mp[34]|m4a|ogg|opus|webm|mkv)$ no-gzip dont-vary
</IfModule>

<IfModule expires_module>
    ExpiresActive On
    ExpiresByType text/css                 "access plus 30 days"
    ExpiresByType application/javascript   "access plus 30 days"
    ExpiresByType image/png                "access plus 30 days"
    ExpiresByType image/jpeg               "access plus 30 days"
    ExpiresByType image/webp               "access plus 30 days"
    ExpiresByType image/gif                "access plus 30 days"
    ExpiresByType image/svg+xml            "access plus 30 days"
    ExpiresByType image/x-icon             "access plus 30 days"
    ExpiresByType font/woff                "access plus 30 days"
    ExpiresByType font/woff2               "access plus 30 days"
    ExpiresByType audio/mpeg               "access plus 30 days"
    ExpiresByType text/html                "access plus 0 seconds"
    ExpiresByType application/xml          "access plus 1 hour"
</IfModule>

<IfModule mime_module>
    TypesConfig /etc/apache2/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
    AddType image/webp .webp
    AddType font/woff .woff
    AddType font/woff2 .woff2
    AddType application/manifest+json .webmanifest
</IfModule>

<IfModule mime_magic_module>
    MIMEMagicFile /etc/apache2/magic
</IfModule>

IncludeOptional /etc/apache2/conf.d/*.conf
