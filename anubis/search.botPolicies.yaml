# ===== Request profiles =====
requestProfiles:
  default:
    rateLimit: 120/minute
  strict:
    rateLimit: 30/minute
  bots:
    rateLimit: 15/minute
  trusted:
    rateLimit: 300/minute

# ===== Rate limits =====
rateLimits:
  default: 120/minute
  strict: 30/minute
  bots: 15/minute
  trusted: 300/minute
  burstWindow: 10s

# ===== Challenge policies (Forgejo paths tuned) =====
challengePolicies:
  paths:
    - path: "/raw/"
      difficulty: 6
      rateLimitProfile: strict
    - path: "/blame/"
      difficulty: 5
      rateLimitProfile: strict
    - path: "/commits/"
      difficulty: 5
      rateLimitProfile: default
    - path: "/src/"
      difficulty: 4
      rateLimitProfile: default
    - path: "/api/"
      difficulty: 5
      rateLimitProfile: strict
    - path: "/"
      difficulty: 3
      rateLimitProfile: default

  methods:
    - method: "GET"
      difficultyOffset: 0
    - method: "HEAD"
      difficultyOffset: -1
    - method: "POST"
      difficultyOffset: +1
    - method: "PUT"
      difficultyOffset: +1
    - method: "DELETE"
      difficultyOffset: +2

# ===== Origin policies (behind Cloudflare/Nginx Proxy Manager) =====
originPolicies:
  # Trust CF-Connecting-IP (Cloudflare real client IP)
  - header: "CF-Connecting-IP"
    trustIfPresent: true
  # Also honor X-Forwarded-For set by Nginx Proxy Manager (left-most client IP)
  - header: "X-Forwarded-For"
    trustIfPresent: true

# ===== Heuristics =====
heuristics:
  classifyBotsByUA: true
  classifyBotsByRate: true
  emptyUAIsBot: true
  minChallengeIntervalMs: 250

# ===== Challenge lifecycle =====
challengeTTL:
  duration: 120s
  maxReuse: 1

# ===== Logging =====
logging:
  level: INFO
  format: json
  redactHeaders:
    - "Authorization"
    - "Cookie"
    - "X-API-Key"

# ===== Responses =====
responses:
  onDeny:
    status: 403
    body: "Access denied by Anubis policy"
  onBotRateExceeded:
    status: 429
    body: "Too many requests (bot profile)"
  onChallengeIssued:
    includeChallengeIdInLog: true

# ===== Thresholds =====
thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW

  - name: mild-suspicion
    expression:
      all:
        - weight > 0
        - weight < 10
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1

  - name: moderate-suspicion
    expression:
      all:
        - weight >= 10
        - weight < 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2

  - name: mild-proof-of-work
    expression:
      all:
        - weight >= 20
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

  - name: extreme-suspicion
    expression: weight >= 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 6
