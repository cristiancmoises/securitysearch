# anubis.yaml — full updated configuration (forgejo-focused, hardened, proxy-aware)

# ===== Bot rules =====
bots:
  # Deny pathological bots (Techaro defaults)
  - import: (data)/bots/_deny-pathological.yaml

  # Regional scrapers (Brazil-focused; adjust if not relevant)
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml

  # Aggressive AI/LLM bots (swap to moderate/permissive if needed)
  - import: (data)/meta/ai-block-aggressive.yaml
  # - import: (data)/meta/ai-block-moderate.yaml
  # - import: (data)/meta/ai-block-permissive.yaml

  # Allow reputable crawlers (Google, Bing, DDG, Archive, etc.)
  - import: (data)/crawlers/_allow-good.yaml

  # Challenge Firefox AI link previews
  - import: (data)/clients/x-firefox-ai.yaml

  # Allow well-known routes (favicon, robots.txt, .well-known)
  - import: (data)/common/keep-internet-working.yaml

  # Relief for realistic browsers — place BEFORE deny/challenge UA rules
  - name: realistic-browser-catchall
    expression:
      all:
        - '"User-Agent" in headers'
        - '( userAgent.contains("Firefox") ) || ( userAgent.contains("Chrome") ) || ( userAgent.contains("Safari") )'
        - '"Accept" in headers'
        - '"Sec-Fetch-Dest" in headers'
        - '"Sec-Fetch-Mode" in headers'
        - '"Sec-Fetch-Site" in headers'
        - '"Accept-Encoding" in headers'
        - '( headers["Accept-Encoding"].contains("zstd") || headers["Accept-Encoding"].contains("br") )'
        - '"Accept-Language" in headers'
    action: WEIGH
    weight:
      adjust: -10

  # The Upgrade-Insecure-Requests header is often sent by real browsers
  - name: upgrade-insecure-requests
    expression: '"Upgrade-Insecure-Requests" in headers'
    action: WEIGH
    weight:
      adjust: -2

  # Chrome sanity checks — proper client hints
  - name: chrome-is-proper
    expression:
      all:
        - userAgent.contains("Chrome")
        - '"Sec-Ch-Ua" in headers'
        - 'headers["Sec-Ch-Ua"].contains("Chromium")'
        - '"Sec-Ch-Ua-Mobile" in headers'
        - '"Sec-Ch-Ua-Platform" in headers'
    action: WEIGH
    weight:
      adjust: -5

  # Missing Accept header is suspicious
  - name: should-have-accept
    expression: '!("Accept" in headers)'
    action: WEIGH
    weight:
      adjust: 5

  # Generic catchall — “Mozilla|Opera” gets slight weight (old spoofers)
  - name: generic-browser
    user_agent_regex: >-
      Mozilla|Opera
    action: WEIGH
    weight:
      adjust: 10

  # Explicit deny for known bad User-Agents (narrow list to reduce false positives)
  - name: deny-known-bad-uagents
    user_agent_regex: (?i:semrushbot|curl|wget|python-urllib|scrapy|libwww-perl|^$)
    action: DENY

  # Challenge legacy/obsolete browsers instead of outright deny
  - name: challenge-legacy-browsers
    user_agent_regex: (?i:msie\s?[5-6]\.|opera/8\.|opera/9\.|safari/5\.)
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

# ===== DNSBL (disabled by default) =====
dnsbl: false

# ===== Open Graph passthrough =====
openGraph:
  enabled: false
  considerHost: false
  ttl: 24h

# ===== HTTP status codes mapping =====
status_codes:
  CHALLENGE: 200
  DENY: 200

# ===== Storage backend =====
store:
  backend: memory
  parameters: {}

