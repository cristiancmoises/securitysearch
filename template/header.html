<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		{%style%}
		{%page_style%}
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta name="robots" content="{%index%}index,{%index%}follow">
		<link rel="icon" type="image/x-icon" href="/favicon.ico">
		<meta name="description" content="{%server_name%}: {%description%}">
	</head>
	<body>
		<nav class="navigation" aria-label="Primary navigation">
<a href="https://securityops.co/" rel="noreferrer noopener">Home</a>
<a href="https://securityops.co/settings" rel="noreferrer noopener">Settings</a>

</nav>
		<form method="GET" autocomplete="off" role="search" aria-label="Search Security Search">
            <div class="search-surface">
                <input type="search" value="{%search%}" maxlength="500" name="s" placeholder="Search privately…" required enterkeyhint="search" aria-label="Search query">
                {%search_actions%}
            </div>
            <p class="provider-status">{%provider_label%} <span aria-hidden="true">·</span> Change provider in Scraper</p>
			{%provider_notice%}
			<nav class="tabs" aria-label="Search types">
				{%tabs%}
			</nav>
			<div class="filters">
				{%filters%}
			</div>
		</form>
