<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>{%title%}</title>
		<link title="​{%server_name%}" href="/opensearch{%ac%}" rel="search" type="application/opensearchdescription+xml">
		<link rel="stylesheet" href="/static/style.css?v{%version%}">
		{%style%}
		{%page_style%}
		{%page_script%}
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta name="robots" content="{%index%}index,{%index%}follow">
		<link rel="icon" type="image/x-icon" href="/favicon.ico">
		<meta name="description" content="{%server_name%}: {%description%}">
	</head>
	<body>
		<nav class="navigation" aria-label="Primary navigation">
			<a href="/">Home</a>
			<a href="/settings">Settings</a>
			<a href="https://chat.securityops.co/" target="_blank" rel="noreferrer">Chat</a>
			<a href="https://wiki.securityops.co" target="_blank" rel="noreferrer">News</a>
			<a href="https://securityops.com.br/" target="_blank" rel="noreferrer">Brasil</a>
		</nav>
		<form method="GET" autocomplete="off" role="search" aria-label="Search Security Search">
			<div class="searchbox">
				<input type="submit" value="Search" tabindex="-1">
				<div class="wrapper">
					<input type="text" value="{%search%}" maxlength="500" name="s" placeholder="Search with Google by default…" required enterkeyhint="search" aria-label="Search query">
				</div>
				<div class="autocomplete"></div>
			</div>
			<p class="provider-status">Google default <span aria-hidden="true">·</span> Brave available in Scraper</p>
			<nav class="tabs" aria-label="Search types">
				{%tabs%}
			</nav>
			<div class="filters">
				{%filters%}
			</div>
		</form>
